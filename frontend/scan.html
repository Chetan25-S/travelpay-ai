<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Payment Analyzer</title><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script></head><body>
<nav class="nav"><div class="brand">TravelPay <span>AI</span></div><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="price-advisor.html">Live Prices</a><a href="assistant.html">Voice AI</a><button class="nav-logout" onclick="logout()">Logout</button></div></nav><main class="container"><p class="eyebrow">QR → AI → PRICE → BUDGET</p><h1>Scan a UPI QR</h1><p class="lead">Decode a UPI QR, review the merchant and amount, check live price evidence, then record a simulated payment.</p><section class="grid2"><div class="card"><h2>📷 Camera Scanner</h2><div id="reader"></div><div class="actions"><button id="startCamera" class="btn">Start Camera</button><button id="stopCamera" class="btn secondary">Stop</button></div><p id="scanStatus" class="muted">Camera access requires HTTPS (or localhost during local development).</p></div><div class="card"><h2>Payment Details</h2><form id="paymentForm" class="form-grid"><label>Merchant Name<input id="merchant" required placeholder="Restaurant name"></label><label>UPI ID<input id="upi" placeholder="merchant@upi"></label><label>Amount in INR<input id="amount" type="number" min="1" step=".01" required placeholder="1200"></label><label>City for Live Price Check<input id="city" placeholder="Hyderabad"></label><label>Item / Service<input id="item" placeholder="Pizza"></label><button class="btn">Analyze with TravelPay AI</button></form></div></section><div id="result" class="card hidden"></div></main><script src="js/common.js"></script><script>requireAuth();</script><script src="js/scan.js"></script></body></html>
