<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TravelPay AI — Smart Travel Payments</title>
<meta name="description" content="TravelPay AI helps travelers analyze UPI payments, monitor travel budgets, check live price evidence and get AI travel guidance.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="TravelPay AI — Smart Travel Payments">
<meta property="og:description" content="AI-powered travel payment analysis, budget tracking and live price intelligence.">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; }
  :root{
    --ink:#17181b;
    --muted:#8a8b90;
    --line:#d8d8dc;
    --panel:#ececee;
    --paper:#ffffff;
    --accent:#ff6d43;
    --purple:#7148df;
    --pink:#df3d7d;
    --yellow:#f4d23d;
  }
  html,body{height:100%}
  body{
    margin:0;
    min-height:100%;
    display:grid;
    place-items:center;
    background:#fafafa;
    color:var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
    overflow:hidden;
  }

  .shell{
    width:min(1120px, 92vw);
    height:min(640px, 88vh);
    min-height:560px;
    display:grid;
    grid-template-columns:1.03fr .97fr;
    background:var(--panel);
    border:1px solid #dedee0;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(20,20,30,.05);
  }

  /* Left illustration panel */
  .art{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#ececee;
  }
  .art::after{
    content:"";
    position:absolute;
    width:330px;height:100px;
    left:50%; bottom:88px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.055);
    filter:blur(24px);
    border-radius:50%;
  }
  .characters{
    position:relative;
    width:430px;
    height:300px;
    margin-top:30px;
  }

  /* Each character is deliberately made from CSS/SVG-friendly shapes. */
  .doodle{
    position:absolute;
    bottom:32px;
    transform-origin:center bottom;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), filter .35s ease;
  }
  .doodle .body{
    position:relative;
    width:140px;height:210px;
    border-radius:20px 20px 10px 10px;
    box-shadow:inset 0 -6px 12px rgba(0,0,0,.04);
  }
  .purple{
    left:70px; z-index:1;
    transform:translateY(12px) rotate(0deg);
  }
  .purple .body{background:var(--purple)}
  .pink{
    left:163px; z-index:3;
    transform:translateY(66px) scale(.95);
  }
  .pink .body{background:var(--pink); width:82px;height:184px}
  .yellow{
    left:218px; z-index:4;
    transform:translateY(84px);
  }
  .yellow .body{
    width:112px;height:160px;
    background:var(--yellow);
    border-radius:58px 58px 14px 14px;
  }
  .orange{
    left:-20px; z-index:5;
    transform:translateY(120px);
  }
  .orange .body{
    width:230px;height:128px;
    background:#ff7838;
    border-radius:120px 120px 0 0;
  }

  /* Faces */
  .face{
    position:absolute; inset:0;
  }
  .eye{
    position:absolute;
    width:15px;height:15px;
    background:#fff;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.15);
    overflow:hidden;
    transition:all .22s ease;
  }
  .eye::after{
    content:"";
    position:absolute;
    width:6px;height:6px;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#17151b;
    transition:transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .purple .eye.left{left:29px;top:31px}
  .purple .eye.right{left:67px;top:31px}
  .pink .eye.left{left:11px;top:67px}
  .pink .eye.right{left:35px;top:67px}
  .yellow .eye.left{left:35px;top:30px}
  .yellow .eye.right{display:none}
  .orange .eye.left{display:none}
  .orange .eye.right{display:none}

  .mouth{
    position:absolute;
    border:4px solid #16151a;
    border-top:0;
    border-left-color:transparent;
    border-right-color:transparent;
    border-radius:0 0 50px 50px;
    width:27px;height:12px;
    transition:all .25s ease;
  }
  .purple .mouth{left:49px;top:52px}
  .pink .mouth{display:none}
  .yellow .mouth{
    left:24px;top:51px;
    width:48px;height:5px;
    border:0;
    background:#17151a;
    border-radius:0;
  }
  .orange .mouth{display:none}

  /* Login panel */
  .login{
    background:var(--paper);
    margin:5px;
    border-radius:17px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:55px 64px;
  }
  .form-wrap{
    width:min(100%, 340px);
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .brand{
    width:34px;height:34px;
    margin:0 auto 28px;
    position:relative;
  }
  .brand svg{width:100%;height:100%}
  h1{
    font-size:32px;
    line-height:1.05;
    letter-spacing:-1.5px;
    margin:0;
    text-align:center;
    font-weight:750;
  }
  .sub{
    text-align:center;
    color:#909096;
    font-size:11px;
    margin:12px 0 34px;
  }
  form{display:flex;flex-direction:column;gap:16px}
  label{
    display:block;
    color:#76777d;
    font-size:10px;
    font-weight:650;
    margin:0 0 6px;
  }
  .field{
    position:relative;
  }
  input{
    width:100%;
    border:0;
    border-bottom:1.5px solid var(--line);
    outline:none;
    padding:0 0 11px;
    background:transparent;
    color:#202126;
    font-size:14px;
    transition:border-color .2s ease;
  }
  input:focus{border-color:#9a9ba0}
  .password-row{
    position:relative;
  }
  .toggle{
    position:absolute;
    right:0;
    bottom:9px;
    width:23px;height:20px;
    border:0;
    background:none;
    cursor:pointer;
    opacity:.75;
    padding:0;
  }
  .toggle svg{width:100%;height:100%}
  .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:-6px;
    font-size:10px;
    color:#a0a0a5;
  }
  .remember{display:flex;align-items:center;gap:6px;cursor:pointer}
  .remember input{width:12px;height:12px;margin:0;accent-color:#17181b;border:0}
  .forgot{color:#a0a0a5;text-decoration:none}
  .forgot:hover{text-decoration:underline}
  button.submit{
    border:0;
    border-radius:25px;
    background:#17181b;
    color:#fff;
    height:45px;
    margin-top:12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:transform .18s ease, background .2s ease;
  }
  button.submit:hover{transform:translateY(-1px);background:#28292d}
  button.submit:active{transform:translateY(1px)}
  .google{
    height:45px;
    border-radius:25px;
    border:0;
    background:#f2f2f3;
    color:#2b2c30;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:12px;
    font-weight:650;
    cursor:pointer;
    transition:background .2s ease;
  }
  .google:hover{background:#e9e9eb}
  .google svg{width:16px;height:16px}
  .signup{
    margin-top:auto;
    padding-top:34px;
    text-align:center;
    color:#8c8c92;
    font-size:10px;
  }
  .signup a{color:#66676c;font-weight:700;text-decoration:none}
  .signup a:hover{text-decoration:underline}

  /* Doodle state classes */
  .state-curious .doodle{filter:saturate(1.08)}
  .state-curious .purple{transform:translateY(8px) rotate(-1deg)}
  .state-curious .pink{transform:translateY(62px) scale(.95) rotate(1deg)}
  .state-curious .yellow{transform:translateY(80px) rotate(-1deg)}
  .state-curious .purple .mouth{
    width:20px;height:18px;border:3px solid #17151a;border-top-color:transparent;
    border-radius:50%;
  }
  .state-blind .doodle{transform-origin:center center}
  .state-blind .purple{transform:translateY(17px) rotate(3deg)}
  .state-blind .pink{transform:translateY(69px) scale(.95) rotate(-4deg)}
  .state-blind .yellow{transform:translateY(88px) rotate(4deg)}
  .state-blind .eye::after{transform:translate(-50%,-50%) scale(0)}
  .state-blind .eye{
    height:5px;
    margin-top:5px;
    border-color:#17151a;
    background:transparent;
    border-width:2px 0 0;
    border-radius:50%;
  }
  .state-blind .purple .mouth{
    width:18px;height:18px;border:3px solid #17151a;border-radius:50%;
  }
  .state-blind .pink::after,
  .state-blind .yellow::after{
    content:"";
    position:absolute;
    width:50px;height:50px;
    border-radius:50%;
    border:7px solid rgba(255,255,255,.88);
    opacity:.9;
  }
  .state-blind .pink::after{left:35px;top:62px}
  .state-blind .yellow::after{left:10px;top:53px}
  .state-success .doodle{animation:cheer .65s ease-in-out infinite alternate}
  .state-success .eye::after{transform:translate(-50%,-50%) scale(1.15)}
  .state-success .purple .mouth{
    height:22px;width:38px;border:4px solid #17151a;border-top:0;border-radius:0 0 30px 30px;
  }
  .state-success .pink .eye,
  .state-success .yellow .eye{transform:translateY(-3px)}
  @keyframes cheer{
    from{transform:translateY(0) rotate(-2deg)}
    to{transform:translateY(-10px) rotate(2deg)}
  }

  @media (max-width: 820px){
    body{overflow:auto;padding:22px 0}
    .shell{
      width:min(520px,92vw);
      height:auto;
      min-height:0;
      grid-template-columns:1fr;
    }
    .art{height:300px}
    .login{margin:0;border-radius:0;padding:45px 34px}
    .characters{transform:scale(.82);margin-top:-5px}
    .signup{margin-top:35px}
  }
  @media (max-width:480px){
    .art{height:260px}
    .login{padding:38px 26px}
    h1{font-size:29px}
  }
</style>
</head>
<body>
<main class="shell" id="app">
  <section class="art" aria-label="Animated doodle characters">
    <div class="characters" id="characters">
      <div class="doodle purple" data-doodle>
        <div class="body">
          <div class="face">
            <span class="eye left"></span><span class="eye right"></span>
            <span class="mouth"></span>
          </div>
        </div>
      </div>
      <div class="doodle pink" data-doodle>
        <div class="body">
          <div class="face">
            <span class="eye left"></span><span class="eye right"></span>
          </div>
        </div>
      </div>
      <div class="doodle yellow" data-doodle>
        <div class="body">
          <div class="face">
            <span class="eye left"></span>
            <span class="mouth"></span>
          </div>
        </div>
      </div>
      <div class="doodle orange" data-doodle>
        <div class="body">
          <div class="face">
            <span class="mouth"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="login">
    <div class="form-wrap">
      <div class="brand" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M8 9.5 28.5 4l7 8.2-4.2 14.4-14.2 7.2-8.1-8.1L8 9.5Z" stroke="#17181b" stroke-width="5" stroke-linejoin="round"/>
          <path d="m9.8 10.3 8.1 6.2 10.8-3.9" stroke="#17181b" stroke-width="3.4"/>
        </svg>
      </div>

      <h1>Welcome back!</h1>
      <p class="sub">Please enter your details</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 placeholder="you@example.com" required />
        </div>

        <div class="field password-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="Enter your password" required />
          <button class="toggle" type="button" id="togglePassword" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M2.5 12s3.3-5 9.5-5 9.5 5 9.5 5-3.3 5-9.5 5-9.5-5-9.5-5Z" stroke="#1b1c20" stroke-width="1.7"/>
              <circle cx="12" cy="12" r="2.6" stroke="#1b1c20" stroke-width="1.7"/>
            </svg>
          </button>
        </div>

        <div class="meta">
          <label class="remember"><input type="checkbox" /> <span>Remember me</span></label>
          <a class="forgot" href="#" id="forgot">Forgot password?</a>
        </div>

        <button class="submit" type="submit">Log In</button>

        <button class="google" type="button" id="googleBtn">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M21.35 12.2c0-.72-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.95 2.94v2.44h3.16c1.85-1.7 2.9-4.2 2.9-7.21Z"/>
            <path fill="#34A853" d="M12 21.65c2.64 0 4.85-.87 6.46-2.36l-3.16-2.44c-.87.58-1.98.92-3.3.92-2.54 0-4.7-1.72-5.47-4.03H3.26v2.51A9.76 9.76 0 0 0 12 21.65Z"/>
            <path fill="#FBBC05" d="M6.53 13.74A5.86 5.86 0 0 1 6.23 12c0-.6.1-1.19.3-1.74V7.75H3.26A9.76 9.76 0 0 0 2.24 12c0 1.57.38 3.06 1.02 4.25l3.27-2.51Z"/>
            <path fill="#EA4335" d="M12 6.23c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.3 14.64 2.35 12 2.35a9.76 9.76 0 0 0-8.74 5.4l3.27 2.51C7.3 7.95 9.46 6.23 12 6.23Z"/>
          </svg>
          Log in with Google
        </button>
      </form>

      <div class="signup">Don't have an account? <a href="#" id="signup">Sign Up</a></div>
    </div>
  </section>
</main>

<script>
  const app = document.getElementById('app');
  const characters = [...document.querySelectorAll('[data-doodle]')];
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const form = document.getElementById('loginForm');
  const toggle = document.getElementById('togglePassword');

  let currentState = 'idle';
  let mouseX = innerWidth / 2;
  let mouseY = innerHeight / 2;

  /*
   * Cursor-tracking math:
   * 1. Find the vector from each eye's center to the mouse.
   * 2. atan2(y, x) gives that vector's angle.
   * 3. Convert the angle back into a small X/Y offset.
   * 4. requestAnimationFrame applies the result once per browser frame,
   *    while CSS transitions make the pupils glide instead of snapping.
   */
  function trackEyes(x, y) {
    if (currentState !== 'idle') return;

    characters.forEach((doodle) => {
      doodle.querySelectorAll('.eye').forEach((eye) => {
        if (getComputedStyle(eye).display === 'none') return;

        const r = eye.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dx = x - cx;
        const dy = y - cy;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const maxMove = 4.5;

        const pupilX = (dx / distance) * Math.min(maxMove, Math.abs(dx) / 18);
        const pupilY = (dy / distance) * Math.min(maxMove, Math.abs(dy) / 18);

        eye.style.setProperty('--px', `${pupilX}px`);
        eye.style.setProperty('--py', `${pupilY}px`);
        eye.style.setProperty('--pupil-transform',
          `translate(calc(-50% + ${pupilX}px), calc(-50% + ${pupilY}px))`);
        eye.querySelector('::after');
        // CSS cannot directly style pseudo-elements from JS, so use a data
        // attribute and a CSS custom property consumed by the rule below.
        eye.style.setProperty('--eye-x', `${pupilX}px`);
        eye.style.setProperty('--eye-y', `${pupilY}px`);
      });
    });
  }

  // Keep mouse tracking lightweight by doing work at most once per frame.
  let raf = 0;
  window.addEventListener('pointermove', (event) => {
    mouseX = event.clientX;
    mouseY = event.clientY;
    if (!raf) {
      raf = requestAnimationFrame(() => {
        trackEyes(mouseX, mouseY);
        raf = 0;
      });
    }
  }, { passive: true });

  function setState(state) {
    currentState = state;
    app.classList.remove('state-curious', 'state-blind', 'state-success');
    if (state !== 'idle') app.classList.add(`state-${state}`);
  }

  email.addEventListener('focus', () => setState('curious'));
  password.addEventListener('focus', () => setState('blind'));

  // Returning to the page without a focused field restores idle tracking.
  [email, password].forEach(input => {
    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (document.activeElement !== email && document.activeElement !== password) {
          setState('idle');
          trackEyes(mouseX, mouseY);
        }
      }, 0);
    });
  });

  toggle.addEventListener('click', () => {
    const showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    if (!showing) setState('idle');
    else setState('blind');
  });


  document.getElementById('forgot').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Password reset flow can be connected here.');
  });

  document.getElementById('signup').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Sign-up flow can be connected here.');
  });

  // TravelPay AI demo authentication: this is presentation-only UI auth.
  // Real credentials should be wired to a backend auth provider before production use.
  const AUTH_KEY = "travelpay_demo_auth";
  if (sessionStorage.getItem(AUTH_KEY) === "true") {
    location.replace("index.html");
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    sessionStorage.setItem(AUTH_KEY, "true");
    setState("success");
    const button = form.querySelector(".submit");
    button.textContent = "Welcome to TravelPay ✓";
    setTimeout(() => location.replace("index.html"), 700);
  });

  document.getElementById("googleBtn").addEventListener("click", () => {
    sessionStorage.setItem(AUTH_KEY, "true");
    setState("success");
    setTimeout(() => location.replace("index.html"), 700);
  });

  // Initialize pupil positions.
  trackEyes(mouseX, mouseY);
</script>

<style>
  /* CSS custom properties let JS move the pupils without rebuilding SVG/DOM. */
  .eye::after{
    transform:translate(calc(-50% + var(--eye-x, 0px)), calc(-50% + var(--eye-y, 0px)));
    transition:transform .16s cubic-bezier(.2,.8,.2,1);
  }
  .state-blind .eye::after{
    transform:translate(-50%,-50%) scale(0);
  }
</style>
</body>
</html>
